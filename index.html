
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Photo dans zone blanche - Mariage</title>
  <style>
    body {
      background: #fff;
      font-family: 'Georgia', serif;
      text-align: center;
      padding: 20px;
    }
    .container {
      position: relative;
      width: 600px;
      height: 1000px;
      margin: auto;
      border: 1px solid #ccc;
      overflow: hidden;
    }
    .fond {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    .photo-zone {
      position: absolute;
      top: 250px;
      left: 0;
      width: 100%;
      height: 500px;
      overflow: hidden;
      z-index: 1;
      mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
      -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
    }
    .photo-zone img {
      position: absolute;
      top: 0;
      left: 0;
      cursor: move;
      user-select: none;
    }
    #controls {
      margin-top: 20px;
    }
    #downloadBtn {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #d4af37;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Ajoutez votre photo dans la zone blanche</h2>
  <div id="controls">
    <input type="file" id="photoInput" accept="image/*">
    <br>
    <button id="downloadBtn">Télécharger</button>
  </div>

  <div class="container" id="captureArea">
    <img src="fond_marbre_degrade.png" class="fond" alt="Fond marbré">
    <div class="photo-zone" id="photoZone">
      <img id="userPhoto" src="">
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    const photoInput = document.getElementById('photoInput');
    const userPhoto = document.getElementById('userPhoto');
    const photoZone = document.getElementById('photoZone');
    let isDragging = false;
    let offsetX, offsetY;

    photoInput.addEventListener('change', (e) => {
      const reader = new FileReader();
      reader.onload = (event) => {
        userPhoto.src = event.target.result;
        userPhoto.style.width = '600px';
        userPhoto.style.height = 'auto';
        userPhoto.style.left = '0px';
        userPhoto.style.top = '0px';
      };
      reader.readAsDataURL(e.target.files[0]);
    });

    userPhoto.addEventListener('mousedown', (e) => {
      isDragging = true;
      offsetX = e.offsetX;
      offsetY = e.offsetY;
    });

    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        const rect = photoZone.getBoundingClientRect();
        let x = e.clientX - rect.left - offsetX;
        let y = e.clientY - rect.top - offsetY;
        userPhoto.style.left = `${x}px`;
        userPhoto.style.top = `${y}px`;
      }
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
      html2canvas(document.getElementById('captureArea')).then(canvas => {
        const link = document.createElement('a');
        link.download = 'panneau_photo_mariage.png';
        link.href = canvas.toDataURL();
        link.click();
      });
    });
  </script>

</body>
</html>
